<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPL Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0c0c0d;
    --surface: #17181a;
    --surface2: #1f2023;
    --border: #2a2b2e;
    --text: #eceef0;
    --text-dim: #8a8d93;
    --accent: #6ee7b7;
    --accent-dim: #2c4a3d;
    --danger: #f87171;
    box-sizing: border-box;
  }
  * { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    padding: 20px 16px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; letter-spacing: 0.2px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .tab {
    flex: none;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text-dim);
    font-size: 13px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-dim); }
  .view-toggle { display: flex; gap: 6px; margin-top: 10px; }
  .view-toggle button {
    flex: 1; padding: 8px; border-radius: 8px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .view-toggle button.active { color: var(--text); border-color: var(--accent-dim); }
  main { padding: 16px; padding-bottom: 100px; max-width: 560px; margin: 0 auto; }
  .date-row { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .date-row input { background: transparent; color: var(--accent); border: none; font-size: 12px; font-family: inherit; }
  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .exercise-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .exercise-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .sets-grid { display: flex; flex-direction: column; gap: 6px; }
  .set-row { display: grid; grid-template-columns: 24px 1fr 1fr 24px; gap: 8px; align-items: center; }
  .set-row .idx { font-size: 11px; color: var(--text-dim); text-align: center; }
  .set-row input[type=number] {
    width: 100%; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px; text-align: center;
  }
  .set-row input:focus { outline: none; border-color: var(--accent-dim); }
  .set-row .done { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); }
  .set-row .done.checked { background: var(--accent); border-color: var(--accent); }
  .add-set { font-size: 11px; color: var(--text-dim); background: none; border: none; padding: 6px 0 0; }
  footer.save-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .save-btn {
    width: 100%; max-width: 560px; margin: 0 auto; display: block;
    padding: 14px; border-radius: 12px; border: none;
    background: var(--accent); color: #06251a; font-weight: 700; font-size: 14px;
  }
  .save-btn:active { opacity: 0.85; }
  .history-entry {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .history-entry .hd { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .history-entry .hd .day-tag { color: var(--accent); }
  .history-entry table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .history-entry td { padding: 3px 0; color: var(--text); }
  .history-entry .del { color: var(--danger); font-size: 11px; background: none; border: none; padding: 4px 0; }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 40px 0; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .toolbar button {
    flex: 1; padding: 10px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>PPL / Abs / Upper</h1>
  <div class="tabs" id="tabs"></div>
  <div class="view-toggle">
    <button id="btnLog" class="active">Log</button>
    <button id="btnHistory">History</button>
  </div>
</header>

<main>
  <div id="logView">
    <div class="date-row">Date: <input type="date" id="dateInput"></div>
    <div id="exerciseList"></div>
  </div>
  <div id="historyView" style="display:none">
    <div class="toolbar">
      <button id="exportBtn">Export JSON</button>
      <button id="importBtn">Import JSON</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <div id="historyList"></div>
  </div>
</main>

<footer class="save-bar" id="saveBar">
  <button class="save-btn" id="saveBtn">Save Session</button>
</footer>

<script>
const PLAN = {
  Push: [
    { name: "Barbell/DB Bench Press", meta: "4 sets · 5–8 reps" },
    { name: "Overhead Press", meta: "3 sets · 6–10 reps" },
    { name: "Incline DB Press", meta: "3 sets · 8–12 reps" },
    { name: "Lateral Raise", meta: "3 sets · 12–15 reps" },
    { name: "Cable/DB Triceps Extension", meta: "3 sets · 10–12 reps" },
    { name: "Dips or Push-ups (finisher)", meta: "2 sets · AMRAP" },
  ],
  Pull: [
    { name: "Deadlift or Rack Pull", meta: "3 sets · 5 reps" },
    { name: "Pull-ups / Lat Pulldown", meta: "4 sets · 6–10 reps" },
    { name: "Barbell/Chest-Supported Row", meta: "3 sets · 8–10 reps" },
    { name: "Face Pull", meta: "3 sets · 12–15 reps" },
    { name: "Barbell/DB Curl", meta: "3 sets · 10–12 reps" },
    { name: "Hammer Curl", meta: "2 sets · 12 reps" },
  ],
  Legs: [
    { name: "Leg Press (sub for back squat)", meta: "4 sets · 8–10 reps" },
    { name: "Romanian Deadlift (light–mod load)", meta: "3 sets · 8–10 reps" },
    { name: "Walking Lunge / Split Squat", meta: "3 sets · 10/leg" },
    { name: "Leg Curl", meta: "3 sets · 10–12 reps" },
    { name: "Standing Calf Raise", meta: "3 sets · 12–15 reps" },
    { name: "Hip Thrust", meta: "3 sets · 10–12 reps" },
  ],
  Abs: [
    { name: "Dead Bug", meta: "3 sets · 10/side" },
    { name: "Bird Dog", meta: "3 sets · 10/side" },
    { name: "Pallof Press", meta: "3 sets · 10/side" },
    { name: "Hanging Knee Raise", meta: "3 sets · 10–12 reps" },
    { name: "Side Plank", meta: "3 sets · 30–45s/side" },
    { name: "Farmer's Carry", meta: "3 sets · 40m" },
  ],
  Upper: [
    { name: "Flat DB Press", meta: "3 sets · 10–12 reps" },
    { name: "Seated Row", meta: "3 sets · 10–12 reps" },
    { name: "Arnold Press", meta: "3 sets · 10–12 reps" },
    { name: "Lat Pulldown (wide grip)", meta: "3 sets · 10–12 reps" },
    { name: "Cable Fly", meta: "2 sets · 12–15 reps" },
    { name: "Rear Delt Fly", meta: "2 sets · 12–15 reps" },
    { name: "Curl + Triceps Superset", meta: "2 sets · 12/12" },
  ],
};

const DAYS = Object.keys(PLAN);
let currentDay = DAYS[0];
let currentSets = {}; // exerciseName -> [{w,r,done}]
let editingHistoryId = null;

const el = id => document.getElementById(id);
const STORAGE_KEY = "ppl_log_history_v1";

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch (e) { return []; }
}
function saveHistory(h) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }
  catch (e) { alert("Could not save — storage may be full."); }
}

function initSetsForDay(day) {
  currentSets = {};
  PLAN[day].forEach(ex => {
    const n = parseInt(ex.meta.match(/(\d+)\s*sets?/i)?.[1]) || 3;
    currentSets[ex.name] = Array.from({ length: n }, () => ({ w: "", r: "", done: false }));
  });
}

function renderTabs() {
  el("tabs").innerHTML = DAYS.map(d =>
    `<button class="tab ${d===currentDay?'active':''}" data-day="${d}">${d}</button>`
  ).join("");
  el("tabs").querySelectorAll(".tab").forEach(btn => {
    btn.onclick = () => { currentDay = btn.dataset.day; initSetsForDay(currentDay); renderTabs(); renderExercises(); };
  });
}

function renderExercises() {
  el("exerciseList").innerHTML = PLAN[currentDay].map(ex => {
    const sets = currentSets[ex.name];
    const rows = sets.map((s, i) => `
      <div class="set-row" data-ex="${ex.name}" data-i="${i}">
        <div class="idx">${i+1}</div>
        <input type="number" inputmode="decimal" placeholder="kg" value="${s.w}" data-field="w">
        <input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" data-field="r">
        <button class="done ${s.done?'checked':''}" data-field="done"></button>
      </div>
    `).join("");
    return `
      <div class="exercise-card">
        <div class="exercise-name">${ex.name}</div>
        <div class="exercise-meta">${ex.meta}</div>
        <div class="sets-grid">${rows}</div>
      </div>
    `;
  }).join("");

  el("exerciseList").querySelectorAll(".set-row input").forEach(input => {
    input.oninput = () => {
      const row = input.closest(".set-row");
      const ex = row.dataset.ex, i = +row.dataset.i, field = input.dataset.field;
      currentSets[ex][i][field] = input.value;
    };
  });
  el("exerciseList").querySelectorAll(".set-row .done").forEach(btn => {
    btn.onclick = () => {
      const row = btn.closest(".set-row");
      const ex = row.dataset.ex, i = +row.dataset.i;
      currentSets[ex][i].done = !currentSets[ex][i].done;
      btn.classList.toggle("checked");
    };
  });
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function saveSession() {
  const date = el("dateInput").value || todayStr();
  const exercises = PLAN[currentDay].map(ex => ({
    name: ex.name,
    sets: currentSets[ex.name].filter(s => s.w !== "" || s.r !== "" || s.done),
  })).filter(ex => ex.sets.length > 0);

  if (exercises.length === 0) {
    alert("Log at least one set before saving.");
    return;
  }

  const entry = { id: editingHistoryId || Date.now().toString(), date, day: currentDay, exercises };
  let hist = loadHistory();
  if (editingHistoryId) {
    hist = hist.map(h => h.id === editingHistoryId ? entry : h);
  } else {
    hist.unshift(entry);
  }
  saveHistory(hist);
  editingHistoryId = null;
  el("saveBtn").textContent = "Saved ✓";
  setTimeout(() => { el("saveBtn").textContent = "Save Session"; }, 1200);
}

function renderHistory() {
  const hist = loadHistory();
  if (hist.length === 0) {
    el("historyList").innerHTML = `<div class="empty">No sessions logged yet.</div>`;
    return;
  }
  el("historyList").innerHTML = hist.map(h => `
    <div class="history-entry">
      <div class="hd"><span>${h.date}</span><span class="day-tag">${h.day}</span></div>
      <table>
        ${h.exercises.map(ex => `
          <tr><td colspan="2" style="padding-top:6px;font-weight:600">${ex.name}</td></tr>
          ${ex.sets.map(s => `<tr><td style="color:var(--text-dim)">Set</td><td>${s.w||'-'}kg × ${s.r||'-'} ${s.done?'✓':''}</td></tr>`).join("")}
        `).join("")}
      </table>
      <button class="del" data-id="${h.id}">Delete</button>
    </div>
  `).join("");
  el("historyList").querySelectorAll(".del").forEach(btn => {
    btn.onclick = () => {
      if (!confirm("Delete this session?")) return;
      const hist2 = loadHistory().filter(h => h.id !== btn.dataset.id);
      saveHistory(hist2);
      renderHistory();
    };
  });
}

el("btnLog").onclick = () => {
  el("btnLog").classList.add("active"); el("btnHistory").classList.remove("active");
  el("logView").style.display = "block"; el("historyView").style.display = "none";
  el("saveBar").style.display = "block";
};
el("btnHistory").onclick = () => {
  el("btnHistory").classList.add("active"); el("btnLog").classList.remove("active");
  el("historyView").style.display = "block"; el("logView").style.display = "none";
  el("saveBar").style.display = "none";
  renderHistory();
};
el("saveBtn").onclick = saveSession;

el("exportBtn").onclick = () => {
  const data = JSON.stringify(loadHistory(), null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `ppl-log-export-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
el("importBtn").onclick = () => el("importFile").click();
el("importFile").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!Array.isArray(imported)) throw new Error("bad format");
      const existing = loadHistory();
      const ids = new Set(existing.map(h => h.id));
      const merged = existing.concat(imported.filter(h => !ids.has(h.id)));
      saveHistory(merged);
      renderHistory();
      alert("Import complete.");
    } catch (err) {
      alert("Could not read that file — make sure it's an export from this app.");
    }
  };
  reader.readAsText(file);
};

el("dateInput").value = todayStr();
initSetsForDay(currentDay);
renderTabs();
renderExercises();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
