<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olahtubuh</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0c0c0d;
    --surface: #17181a;
    --surface2: #1f2023;
    --border: #2a2b2e;
    --text: #eceef0;
    --text-dim: #8a8d93;
    --accent: #6ee7b7;
    --accent-dim: #2c4a3d;
    --danger: #f87171;
    box-sizing: border-box;
  }
  * { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    padding: 20px 16px 12px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; letter-spacing: 0.2px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .tab {
    flex: none;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface);
    color: var(--text-dim);
    font-size: 13px;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .tab.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-dim); }
  .view-toggle { display: flex; gap: 6px; margin-top: 10px; }
  .view-toggle button {
    flex: 1; padding: 8px; border-radius: 8px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .view-toggle button.active { color: var(--text); border-color: var(--accent-dim); }
  main { padding: 16px; padding-bottom: 100px; max-width: 560px; margin: 0 auto; }
  .date-row { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .date-row input { background: transparent; color: var(--accent); border: none; font-size: 12px; font-family: inherit; }
  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .exercise-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .exercise-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .sets-grid { display: flex; flex-direction: column; gap: 6px; }
  .set-row { display: grid; grid-template-columns: 24px 1fr 1fr 24px; gap: 8px; align-items: center; }
  .set-row .idx { font-size: 11px; color: var(--text-dim); text-align: center; }
  .set-row input[type=number] {
    width: 100%; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px; text-align: center;
  }
  .set-row input:focus { outline: none; border-color: var(--accent-dim); }
  .set-row .done { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); }
  .set-row .done.checked { background: var(--accent); border-color: var(--accent); }
  .add-set { font-size: 11px; color: var(--text-dim); background: none; border: none; padding: 6px 0 0; }
  footer.save-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .save-btn {
    width: 100%; max-width: 560px; margin: 0 auto; display: block;
    padding: 14px; border-radius: 12px; border: none;
    background: var(--accent); color: #06251a; font-weight: 700; font-size: 14px;
  }
  .save-btn:active { opacity: 0.85; }
  .history-entry {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .history-entry .hd { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .history-entry .hd .day-tag { color: var(--accent); }
  .history-entry table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .history-entry td { padding: 3px 0; color: var(--text); }
  .history-entry .del { color: var(--danger); font-size: 11px; background: none; border: none; padding: 4px 0; }
  .empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 40px 0; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .toolbar button {
    flex: 1; padding: 10px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .edit-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
  }
  .edit-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .edit-row label { font-size: 10px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .edit-field { flex: 1; }
  .edit-field input {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .edit-field input:focus { outline: none; border-color: var(--accent-dim); }
  .sets-field { max-width: 70px; }
  .remove-ex {
    width: 30px; height: 30px; border-radius: 8px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--danger); font-size: 15px; flex: none; margin-top: 14px;
  }
  .add-ex-btn {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px dashed var(--border);
    background: transparent; color: var(--text-dim); font-size: 13px; margin-bottom: 10px;
  }
  .reset-day-btn {
    width: 100%; padding: 10px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--danger); font-size: 12px; margin-top: 4px;
  }
  .subtabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .subtabs button {
    flex: 1; padding: 9px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text-dim); font-size: 12px;
  }
  .subtabs button.active { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); }
  .ex-select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 13px; font-family: inherit;
    margin-bottom: 14px; appearance: none;
  }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 10px; margin-bottom: 10px;
  }
  .chart-card svg { width: 100%; height: auto; display: block; }
  .chart-axis-label { fill: var(--text-dim); font-size: 9px; font-family: inherit; }
  .chart-grid { stroke: var(--border); stroke-width: 1; }
  .chart-line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .chart-point { fill: var(--accent); }
  .chart-value { fill: var(--text); font-size: 9px; font-family: inherit; text-anchor: middle; }
  .chart-stats { display: flex; gap: 8px; margin-bottom: 10px; }
  .chart-stat {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px; text-align: center;
  }
  .chart-stat .v { font-size: 16px; font-weight: 700; color: var(--accent); }
  .chart-stat .l { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1>Olahtubuh</h1>
  <div class="tabs" id="tabs"></div>
  <div class="view-toggle">
    <button id="btnLog" class="active">Log</button>
    <button id="btnEdit">Edit</button>
    <button id="btnHistory">History</button>
  </div>
</header>

<main>
  <div id="logView">
    <div class="date-row">Date: <input type="date" id="dateInput"></div>
    <div id="exerciseList"></div>
  </div>
  <div id="editView" style="display:none">
    <div id="editList"></div>
    <button class="add-ex-btn" id="addExBtn">+ Add exercise</button>
    <button class="reset-day-btn" id="resetDayBtn">Reset this day to default</button>
  </div>
  <div id="historyView" style="display:none">
    <div class="subtabs">
      <button id="histEntriesBtn" class="active">Entries</button>
      <button id="histProgressBtn">Progress</button>
    </div>
    <div id="entriesPane">
      <div class="toolbar">
        <button id="exportBtn">Export JSON</button>
        <button id="importBtn">Import JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <div id="historyList"></div>
    </div>
    <div id="progressPane" style="display:none">
      <select class="ex-select" id="exerciseSelect"></select>
      <div id="chartContainer"></div>
    </div>
  </div>
</main>

<footer class="save-bar" id="saveBar">
  <button class="save-btn" id="saveBtn">Save Session</button>
</footer>

<script>
const DEFAULT_PLAN = {
  Chest: [
    { name: "Power Clean", sets: 3, reps: "8-12" },
    { name: "Incline Press (Dumbbell or Barbell)", sets: 3, reps: "8-12" },
    { name: "Flat Dumbbell Bench Press", sets: 3, reps: "8-12" },
    { name: "Tricep Extensions / Pushdown", sets: 3, reps: "8-12" },
    { name: "Seated Hammer Curls", sets: 3, reps: "8-12" },
  ],
  Back: [
    { name: "Snatch", sets: 3, reps: "8-12" },
    { name: "Behind the Back Shoulder Press", sets: 3, reps: "8-12" },
    { name: "Chest Supported Dumbbell Lateral Raises", sets: 3, reps: "8-12" },
    { name: "Face Pulls (Rope)", sets: 3, reps: "8-12" },
    { name: "T-Bar Row (or Seated Cable Row)", sets: 3, reps: "8-12" },
    { name: "Lat Pulldown", sets: 3, reps: "8-12" },
    { name: "Chest Supported Row (Dumbbell or Machine)", sets: 3, reps: "8-12" },
  ],
  Legs: [
    { name: "Barbell Back Squat (or Leg Press)", sets: 3, reps: "8-12" },
    { name: "Romanian Deadlifts (RDLs)", sets: 3, reps: "8-12" },
    { name: "Walking Lunges (Dumbbell or Bodyweight)", sets: 3, reps: "8-12" },
    { name: "Leg Extensions", sets: 3, reps: "8-12" },
    { name: "Hamstring Extensions", sets: 3, reps: "8-12" },
    { name: "Standing Calf Raises", sets: 3, reps: "8-12" },
  ],
  Abs: [
    { name: "Dead Bug", sets: 3, reps: "10/side" },
    { name: "Bird Dog", sets: 3, reps: "10/side" },
    { name: "Pallof Press", sets: 3, reps: "10/side" },
    { name: "Hanging Knee Raise", sets: 3, reps: "10-12" },
    { name: "Side Plank", sets: 3, reps: "30-45s/side" },
    { name: "Farmer's Carry", sets: 3, reps: "40m" },
  ],
};

const DAYS = Object.keys(DEFAULT_PLAN);
const PLAN_KEY = "ppl_custom_plan_v1";
const STORAGE_KEY = "ppl_log_history_v1";
const el = id => document.getElementById(id);

function loadPlan() {
  try {
    const saved = JSON.parse(localStorage.getItem(PLAN_KEY));
    if (saved && typeof saved === "object") {
      // merge: any day not present in saved falls back to default
      const merged = {};
      DAYS.forEach(d => { merged[d] = saved[d] || DEFAULT_PLAN[d].map(e => ({...e})); });
      return merged;
    }
  } catch (e) {}
  const fresh = {};
  DAYS.forEach(d => { fresh[d] = DEFAULT_PLAN[d].map(e => ({...e})); });
  return fresh;
}
function savePlan() {
  try { localStorage.setItem(PLAN_KEY, JSON.stringify(PLAN)); }
  catch (e) { alert("Could not save plan — storage may be full."); }
}

let PLAN = loadPlan();
let currentDay = DAYS[0];
let currentSets = {}; // exerciseName -> [{w,r,done}]
let editingHistoryId = null;

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch (e) { return []; }
}
function saveHistory(h) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }
  catch (e) { alert("Could not save — storage may be full."); }
}

function initSetsForDay(day) {
  currentSets = {};
  PLAN[day].forEach(ex => {
    const n = Math.max(1, parseInt(ex.sets) || 1);
    currentSets[ex.name] = Array.from({ length: n }, () => ({ w: "", r: "", done: false }));
  });
}

function renderTabs() {
  el("tabs").innerHTML = DAYS.map(d =>
    `<button class="tab ${d===currentDay?'active':''}" data-day="${d}">${d}</button>`
  ).join("");
  el("tabs").querySelectorAll(".tab").forEach(btn => {
    btn.onclick = () => {
      currentDay = btn.dataset.day;
      initSetsForDay(currentDay);
      renderTabs();
      renderExercises();
      renderEdit();
    };
  });
}

function renderExercises() {
  el("exerciseList").innerHTML = PLAN[currentDay].map(ex => {
    const sets = currentSets[ex.name] || [];
    const rows = sets.map((s, i) => `
      <div class="set-row" data-ex="${ex.name}" data-i="${i}">
        <div class="idx">${i+1}</div>
        <input type="number" inputmode="decimal" placeholder="kg" value="${s.w}" data-field="w">
        <input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" data-field="r">
        <button class="done ${s.done?'checked':''}" data-field="done"></button>
      </div>
    `).join("");
    return `
      <div class="exercise-card">
        <div class="exercise-name">${ex.name}</div>
        <div class="exercise-meta">${ex.sets} sets &middot; ${ex.reps} reps</div>
        <div class="sets-grid">${rows}</div>
      </div>
    `;
  }).join("");

  el("exerciseList").querySelectorAll(".set-row input").forEach(input => {
    input.oninput = () => {
      const row = input.closest(".set-row");
      const ex = row.dataset.ex, i = +row.dataset.i, field = input.dataset.field;
      currentSets[ex][i][field] = input.value;
    };
  });
  el("exerciseList").querySelectorAll(".set-row .done").forEach(btn => {
    btn.onclick = () => {
      const row = btn.closest(".set-row");
      const ex = row.dataset.ex, i = +row.dataset.i;
      currentSets[ex][i].done = !currentSets[ex][i].done;
      btn.classList.toggle("checked");
    };
  });
}

function renderEdit() {
  el("editList").innerHTML = PLAN[currentDay].map((ex, i) => `
    <div class="edit-card" data-i="${i}">
      <div class="edit-row">
        <div class="edit-field">
          <label>Exercise name</label>
          <input type="text" data-field="name" value="${ex.name.replace(/"/g,'&quot;')}">
        </div>
      </div>
      <div class="edit-row">
        <div class="edit-field sets-field">
          <label>Sets</label>
          <input type="number" min="1" max="10" data-field="sets" value="${ex.sets}">
        </div>
        <div class="edit-field">
          <label>Reps / target</label>
          <input type="text" data-field="reps" value="${ex.reps.replace(/"/g,'&quot;')}">
        </div>
        <button class="remove-ex" data-field="remove">&times;</button>
      </div>
    </div>
  `).join("");

  el("editList").querySelectorAll(".edit-card input").forEach(input => {
    input.oninput = () => {
      const i = +input.closest(".edit-card").dataset.i;
      const field = input.dataset.field;
      PLAN[currentDay][i][field] = field === "sets" ? (parseInt(input.value) || 1) : input.value;
      savePlan();
    };
  });
  el("editList").querySelectorAll(".remove-ex").forEach(btn => {
    btn.onclick = () => {
      const i = +btn.closest(".edit-card").dataset.i;
      if (PLAN[currentDay].length <= 1) { alert("A day needs at least one exercise."); return; }
      PLAN[currentDay].splice(i, 1);
      savePlan();
      renderEdit();
    };
  });
}

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function saveSession() {
  const date = el("dateInput").value || todayStr();
  const exercises = PLAN[currentDay].map(ex => ({
    name: ex.name,
    sets: (currentSets[ex.name] || []).filter(s => s.w !== "" || s.r !== "" || s.done),
  })).filter(ex => ex.sets.length > 0);

  if (exercises.length === 0) {
    alert("Log at least one set before saving.");
    return;
  }

  const entry = { id: editingHistoryId || Date.now().toString(), date, day: currentDay, exercises };
  let hist = loadHistory();
  if (editingHistoryId) {
    hist = hist.map(h => h.id === editingHistoryId ? entry : h);
  } else {
    hist.unshift(entry);
  }
  saveHistory(hist);
  editingHistoryId = null;
  el("saveBtn").textContent = "Saved ✓";
  setTimeout(() => { el("saveBtn").textContent = "Save Session"; }, 1200);
}

function renderHistory() {
  const hist = loadHistory();
  if (hist.length === 0) {
    el("historyList").innerHTML = `<div class="empty">No sessions logged yet.</div>`;
    return;
  }
  el("historyList").innerHTML = hist.map(h => `
    <div class="history-entry">
      <div class="hd"><span>${h.date}</span><span class="day-tag">${h.day}</span></div>
      <table>
        ${h.exercises.map(ex => `
          <tr><td colspan="2" style="padding-top:6px;font-weight:600">${ex.name}</td></tr>
          ${ex.sets.map(s => `<tr><td style="color:var(--text-dim)">Set</td><td>${s.w||'-'}kg × ${s.r||'-'} ${s.done?'✓':''}</td></tr>`).join("")}
        `).join("")}
      </table>
      <button class="del" data-id="${h.id}">Delete</button>
    </div>
  `).join("");
  el("historyList").querySelectorAll(".del").forEach(btn => {
    btn.onclick = () => {
      if (!confirm("Delete this session?")) return;
      const hist2 = loadHistory().filter(h => h.id !== btn.dataset.id);
      saveHistory(hist2);
      renderHistory();
    };
  });
}

function getAllExerciseNames() {
  const hist = loadHistory();
  const names = new Set();
  hist.forEach(h => h.exercises.forEach(ex => names.add(ex.name)));
  return Array.from(names).sort((a, b) => a.localeCompare(b));
}

function getProgressPoints(name) {
  const hist = loadHistory().slice().sort((a, b) => a.date.localeCompare(b.date));
  const points = [];
  hist.forEach(h => {
    const ex = h.exercises.find(e => e.name === name);
    if (!ex) return;
    const weights = ex.sets.map(s => parseFloat(s.w)).filter(w => !isNaN(w) && w > 0);
    if (weights.length === 0) return;
    points.push({ date: h.date, weight: Math.max(...weights) });
  });
  return points;
}

function fmtDate(iso) {
  const [y, m, d] = iso.split("-");
  return `${m}/${d}`;
}

function buildChartSVG(points) {
  const w = 600, h = 260;
  const padL = 40, padR = 14, padT = 16, padB = 34;
  const cw = w - padL - padR, ch = h - padT - padB;
  const weights = points.map(p => p.weight);
  let minW = Math.min(...weights), maxW = Math.max(...weights);
  if (minW === maxW) { minW -= 5; maxW += 5; }
  const range = maxW - minW;
  minW -= range * 0.1; maxW += range * 0.1;

  const xFor = i => points.length > 1 ? padL + (i * cw) / (points.length - 1) : padL + cw / 2;
  const yFor = v => padT + ch - ((v - minW) / (maxW - minW)) * ch;

  const gridLines = 4;
  let gridSvg = "";
  for (let i = 0; i <= gridLines; i++) {
    const v = minW + ((maxW - minW) * i) / gridLines;
    const y = yFor(v);
    gridSvg += `<line class="chart-grid" x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}"/>`;
    gridSvg += `<text class="chart-axis-label" x="${padL-6}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`;
  }

  const pathD = points.map((p, i) => `${i===0?'M':'L'}${xFor(i)},${yFor(p.weight)}`).join(" ");

  const labelEvery = points.length > 7 ? Math.ceil(points.length / 6) : 1;
  let xLabelsSvg = "";
  let dotsSvg = "";
  points.forEach((p, i) => {
    const x = xFor(i), y = yFor(p.weight);
    dotsSvg += `<circle class="chart-point" cx="${x}" cy="${y}" r="3.5"/>`;
    dotsSvg += `<text class="chart-value" x="${x}" y="${y-10}">${p.weight}</text>`;
    if (i % labelEvery === 0 || i === points.length - 1) {
      xLabelsSvg += `<text class="chart-axis-label" x="${x}" y="${h-10}" text-anchor="middle">${fmtDate(p.date)}</text>`;
    }
  });

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridSvg}
    <path class="chart-line" d="${pathD}"/>
    ${dotsSvg}
    ${xLabelsSvg}
  </svg>`;
}

function renderProgress() {
  const names = getAllExerciseNames();
  const select = el("exerciseSelect");
  const prevValue = select.value;
  if (names.length === 0) {
    select.innerHTML = `<option>No logged exercises yet</option>`;
    el("chartContainer").innerHTML = `<div class="empty">Log a session first, then come back here to see progress.</div>`;
    return;
  }
  select.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
  select.value = names.includes(prevValue) ? prevValue : names[0];
  renderChart(select.value);
}

function renderChart(name) {
  const points = getProgressPoints(name);
  if (points.length === 0) {
    el("chartContainer").innerHTML = `<div class="empty">No weight logged for this exercise yet — bodyweight-only sets aren't charted.</div>`;
    return;
  }
  const first = points[0].weight, last = points[points.length - 1].weight;
  const best = Math.max(...points.map(p => p.weight));
  const delta = last - first;
  const sign = delta > 0 ? "+" : "";
  el("chartContainer").innerHTML = `
    <div class="chart-stats">
      <div class="chart-stat"><div class="v">${last}</div><div class="l">Latest</div></div>
      <div class="chart-stat"><div class="v">${best}</div><div class="l">Best</div></div>
      <div class="chart-stat"><div class="v">${sign}${delta}</div><div class="l">Change</div></div>
    </div>
    <div class="chart-card">${buildChartSVG(points)}</div>
  `;
}

function showView(name) {
  el("btnLog").classList.toggle("active", name === "log");
  el("btnEdit").classList.toggle("active", name === "edit");
  el("btnHistory").classList.toggle("active", name === "history");
  el("logView").style.display = name === "log" ? "block" : "none";
  el("editView").style.display = name === "edit" ? "block" : "none";
  el("historyView").style.display = name === "history" ? "block" : "none";
  el("saveBar").style.display = name === "log" ? "block" : "none";
  if (name === "log") { initSetsForDay(currentDay); renderExercises(); }
  if (name === "edit") { renderEdit(); }
  if (name === "history") { showHistorySubtab(currentHistTab); }
}

function showHistorySubtab(tab) {
  currentHistTab = tab;
  el("histEntriesBtn").classList.toggle("active", tab === "entries");
  el("histProgressBtn").classList.toggle("active", tab === "progress");
  el("entriesPane").style.display = tab === "entries" ? "block" : "none";
  el("progressPane").style.display = tab === "progress" ? "block" : "none";
  if (tab === "entries") renderHistory();
  if (tab === "progress") renderProgress();
}

let currentHistTab = "entries";

el("btnLog").onclick = () => showView("log");
el("btnEdit").onclick = () => showView("edit");
el("btnHistory").onclick = () => showView("history");
el("saveBtn").onclick = saveSession;
el("histEntriesBtn").onclick = () => showHistorySubtab("entries");
el("histProgressBtn").onclick = () => showHistorySubtab("progress");
el("exerciseSelect").onchange = () => renderChart(el("exerciseSelect").value);

el("addExBtn").onclick = () => {
  PLAN[currentDay].push({ name: "New exercise", sets: 3, reps: "10-12" });
  savePlan();
  renderEdit();
};
el("resetDayBtn").onclick = () => {
  if (!confirm(`Reset ${currentDay} to the default plan? Your edits for this day will be lost.`)) return;
  PLAN[currentDay] = DEFAULT_PLAN[currentDay].map(e => ({...e}));
  savePlan();
  renderEdit();
};

el("exportBtn").onclick = () => {
  const data = JSON.stringify(loadHistory(), null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `ppl-log-export-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
el("importBtn").onclick = () => el("importFile").click();
el("importFile").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!Array.isArray(imported)) throw new Error("bad format");
      const existing = loadHistory();
      const ids = new Set(existing.map(h => h.id));
      const merged = existing.concat(imported.filter(h => !ids.has(h.id)));
      saveHistory(merged);
      renderHistory();
      alert("Import complete.");
    } catch (err) {
      alert("Could not read that file — make sure it's an export from this app.");
    }
  };
  reader.readAsText(file);
};

el("dateInput").value = todayStr();
initSetsForDay(currentDay);
renderTabs();
renderExercises();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
